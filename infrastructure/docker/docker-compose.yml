version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: hs_postgres
    restart: always
    environment:
      POSTGRES_USER: hs_user
      POSTGRES_PASSWORD: hs_password
      POSTGRES_DB: hs_marketplace
    ports:
      - "5432:5432"
    volumes:
      - hs_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hs_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - hs_redis_data:/data

volumes:
  hs_pg_data:
  hs_redis_data:
